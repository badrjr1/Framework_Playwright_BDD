# ==========================================================
# Application URLs
# ==========================================================
base.url=https://ecommerce-playground.lambdatest.io/
api.base.url=
ws.url=

# ==========================================================
# Timeouts configuration
# Values are in milliseconds
# ==========================================================
timeout.default=10000
timeout.short=3000
timeout.long=30000

# ==========================================================
# Browser configuration
# Supported values:
# chromium, chrome, edge, msedge, firefox, webkit
# ==========================================================
browser.name=chromium
browser.headless=false

# ==========================================================
# Video configuration
# ==========================================================
video.enabled=true
video.dir=target/videos
video.width=1280
video.height=720
video.attach=true

# ==========================================================
# Screenshot configuration
# ==========================================================
screenshot.on.failure=true
screenshot.full.page=true

# ==========================================================
# Logs configuration
# ==========================================================
logs.attach=true
logs.file=target/logs/framework-test.log

# ==========================================================
# AI API URLs
# ==========================================================
ai.claude.messages.url=https://api.anthropic.com/v1/messages
ai.gemini.base.url=https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent?key=%s
ai.openai.responses.url=https://api.openai.com/v1/responses

# ==========================================================
# AI API compatibility
# ==========================================================
ai.anthropic.version=2023-06-01